<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App icon ছবি আপলোড</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; color: #10233f; background: #f3f7fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(100%, 520px); padding: 32px; border: 1px solid #e2eaf0; border-radius: 20px; background: white; box-shadow: 0 20px 60px #10233f16; }
    h1 { margin-top: 0; font-size: 26px; }
    p { color: #526276; line-height: 1.65; }
    input { display: block; width: 100%; margin: 22px 0; padding: 14px; border: 1px solid #cbd8e1; border-radius: 10px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px; color: #062322; background: #36c6b4; font-size: 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>App icon ছবি আপলোড</h1>
    <p>PNG, JPG বা WebP ছবি নির্বাচন করে আপলোড করুন। সর্বোচ্চ ফাইলের আকার 12 MB।</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="image" accept="image/png,image/jpeg,image/webp" required>
      <button type="submit">ছবি আপলোড</button>
    </form>
  </main>
</body>
</html>
